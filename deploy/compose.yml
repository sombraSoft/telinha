# Telinha: one container runs telinha + livekit-server (+ caddy in direct mode, + cloudflared in tunnel mode).
# Host networking: Caddy binds 80/443, LiveKit the media ports from telinha.env, telinha LISTEN (127.0.0.1:8081).
# Config: ./config/telinha.env (copy telinha.env.example there). TELINHA_VERSION: ./.env, written by telinha-update; else latest.
# Values with $ \ or # must be single-quoted in telinha.env (compose interpolates otherwise).
# Linux: copy compose.journald.yml to compose.override.yml to log to journald (journalctl -t telinha).
# Windows Docker Desktop: needs 4.34+ with host networking enabled; prefer INGRESS=tunnel there.
name: telinha

services:
  telinha:
    image: ghcr.io/sombrasoft/telinha:${TELINHA_VERSION:-latest}
    container_name: telinha
    restart: unless-stopped
    network_mode: host
    # bun is PID 1 with children; tini reaps them and forwards signals.
    init: true
    env_file: config/telinha.env
    volumes:
      # Room registry, rendered configs, Caddy certificates: must survive updates.
      - telinha-data:/telinha/data
    healthcheck:
      # busybox wget and sh ship in the image; port must match LISTEN in telinha.env.
      # Unhealthy while a child (livekit, caddy, cloudflared) is down waiting to restart,
      # e.g. Caddy cannot bind 80/443 or a bad tunnel token: then telinha-update's --wait
      # fails and it rolls back. The retries absorb livekit's brief restart on an IP change.
      test:
        - CMD-SHELL
        - >-
          body=$$(wget -qO- http://127.0.0.1:8081/healthz) &&
          case "$$body" in *'"restarting"'*) exit 1 ;; esac
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  # Explicit name: the volume outlives renames of the compose project.
  telinha-data:
    name: telinha-data
