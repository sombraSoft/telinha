<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telinha</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">📺 Telinha <span id="roomName" class="muted"></span></div>
      <div class="top-actions">
        <button id="copyLink" class="ghost" title="Copiar link da sala">🔗 Copiar link</button>
        <button id="statsToggle" class="ghost" title="Estatísticas">📊</button>
        <div id="me" class="me"></div>
      </div>
    </header>

    <main class="body">
      <section id="stage" class="stage">
        <div id="empty" class="empty">
          <div class="empty-icon">🖥️</div>
          <p>Ninguém transmitindo ainda.</p>
          <p class="muted">Clica em <b>Transmitir</b> pra compartilhar sua tela.</p>
        </div>
        <div id="focus" class="focus hidden"></div>
        <div id="grid" class="grid"></div>
      </section>

      <aside class="side">
        <h3>Na sala <span id="count" class="muted"></span></h3>
        <ul id="people" class="people"></ul>
      </aside>
    </main>

    <footer class="bar">
      <div class="bar-left">
        <label>Resolução
          <select id="res">
            <option value="720">720p</option>
            <option value="1080" selected>1080p</option>
            <option value="1440">Fonte (até 1440p)</option>
          </select>
        </label>
        <label>FPS
          <select id="fps">
            <option value="15">15</option>
            <option value="30">30</option>
            <option value="60" selected>60</option>
          </select>
        </label>
        <span id="codecInfo" class="muted small"></span>
        <span id="caps" class="muted small"></span>
      </div>
      <button id="share" class="primary">🖥️ Transmitir</button>
    </footer>

    <button id="audioUnlock" class="unlock hidden">🔊 Clique pra ativar o som</button>
    <div id="toast" class="toast hidden"></div>
  </div>

  <div id="fatal" class="fatal hidden"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
