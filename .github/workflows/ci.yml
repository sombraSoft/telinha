# Checks every PR (including Release PRs opened by the release app and
# Renovate PRs). Job names are the required checks in branch protection, so
# keep them stable.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the previous run; main runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  # Browser tests against the real stack (LiveKit --dev + server + built page).
  # Not a required check yet.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # versions.json pins the child binaries (and their hashes), so it is the key.
      - uses: actions/cache@v6
        with:
          path: .cache/telinha/bin
          key: livekit-${{ runner.os }}-${{ hashFiles('versions.json') }}
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Listed explicitly: telinha-update has no extension, and a missing file
      # should fail the job rather than be silently skipped.
      - name: shellcheck
        run: >-
          shellcheck
          deploy/install-docker.sh
          deploy/telinha-update
          scripts/smoke.sh
      # The image bundles shellcheck, so run: blocks are checked too.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Structure and every asset hash present; a stale hash fails the image job.
      - name: versions.json
        run: bun scripts/versions.ts check

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action lists the PR's commits to scan only those.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting needs pull-requests: write; the failed check and job
          # summary are enough.
          GITLEAKS_ENABLE_COMMENTS: "false"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # arm64's final stage (apk, setcap) runs emulated; the heavy stages run natively.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      # Both release platforms build, so an arm64 break shows up before release.
      - uses: docker/build-push-action@v7
        with:
          # Local checkout, not the default git context, so the PR's tree is built.
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      # amd64 again (cache hit), loaded into the daemon for the smoke test.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: telinha:ci
      # Same script as `bun run image`; it ships in the image.
      - name: smoke
        run: docker run --rm telinha:ci sh scripts/smoke.sh
