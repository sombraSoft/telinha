# Checks every PR (including Release PRs opened by the release app and
# Renovate PRs). The ruleset requires only the `required` job below, so which
# jobs gate a merge is decided here, in a PR, and jobs can be renamed freely.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the previous run; main runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job has a timeout-minutes well above its slowest cold-cache run so far,
# so a hung step (an apt mirror that stops answering) fails within minutes
# instead of holding the runner for the 6-hour default.
jobs:
  # Which areas a PR touches, so jobs that cannot be affected are skipped (a
  # skipped job counts as passed in `required`). Shared config and lockfiles
  # count as every area, and pushes to main always run everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test: ${{ github.event_name == 'push' || steps.f.outputs.all == 'true' || steps.f.outputs.test == 'true' }}
      e2e: ${{ github.event_name == 'push' || steps.f.outputs.all == 'true' || steps.f.outputs.e2e == 'true' }}
      binaries: ${{ github.event_name == 'push' || steps.f.outputs.all == 'true' || steps.f.outputs.binaries == 'true' }}
      docs: ${{ github.event_name == 'push' || steps.f.outputs.all == 'true' || steps.f.outputs.docs == 'true' }}
      image: ${{ github.event_name == 'push' || steps.f.outputs.all == 'true' || steps.f.outputs.image == 'true' }}
      caddy: ${{ github.event_name == 'push' || steps.f.outputs.all == 'true' || steps.f.outputs.caddy == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: f
        with:
          filters: |
            all:
              - .github/workflows/ci.yml
              - package.json
              - '*/package.json'
              - bun.lock
              - bunfig.toml
              - tsconfig.json
              - mise.toml
              - mise.lock
              - global.json
            test:
              - 'server/**'
              - 'web/**'
              - 'docs/**'
              - 'scripts/**'
              - 'e2e/**'
              - 'tray/**'
              - versions.json
              # scripts/toolchain.test.ts holds the Dockerfile's Bun and Go pins and
              # biome.jsonc's schema to mise.toml, so a Renovate group PR that
              # reached only them still runs it.
              - Dockerfile
              - biome.jsonc
            e2e:
              - 'server/**'
              - 'web/**'
              - 'e2e/**'
              - playwright.config.ts
              - versions.json
            binaries:
              - 'server/**'
              - 'web/**'
              - 'tray/**'
              - 'scripts/**'
              - versions.json
            docs:
              - 'docs/**'
              - 'server/**'
            image:
              - Dockerfile
              - .dockerignore
              - 'server/**'
              - 'web/**'
              - 'deploy/**'
              - 'scripts/**'
              - versions.json
            caddy:
              - Dockerfile
              - versions.json
              - scripts/caddy-build.ts

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bun at the version mise.toml names, from the URL and checksum mise.lock
      # records (the action installs with --locked). The Actions cache is at its
      # size cap, so only pushes to main save the mise cache; PRs restore it.
      - id: mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: bun
          cache_save: ${{ github.event_name == 'push' }}
      # Bun's package cache, under the same rule: every job restores the newest
      # entry for its OS and Bun, and only a push to main saves a new one (when
      # bun.lock changed), so PR runs stop filling the 10 GB budget. A missed
      # restore only means a full download.
      - id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ steps.mise.outputs.bun }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ steps.mise.outputs.bun }}-
      - run: bun install --frozen-lockfile
      - if: github.event_name == 'push' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # The tray's MSTest suite; the binaries job only builds the versioned exe.
      - if: runner.os == 'Windows'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      # NuGet's packages, keyed on the tray's lock files: restored here and
      # saved by pushes to main only, as with Bun's. The restore is locked (CI
      # is set, see tray/Directory.Build.props), so a lock file out of step
      # with its csproj fails here.
      - id: nuget-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('tray/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: tray tests
        if: runner.os == 'Windows'
        run: dotnet test tray/tests/telinha-tray.tests.csproj -c Release -nologo
      - if: runner.os == 'Windows' && github.event_name == 'push' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

  # Browser tests against the real stack (LiveKit --dev + server + built page).
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: bun
          cache_save: ${{ github.event_name == 'push' }}
      # Bun's package cache, restored here and saved by pushes to main only (see
      # the test job).
      - id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ steps.mise.outputs.bun }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ steps.mise.outputs.bun }}-
      - run: bun install --frozen-lockfile
      - if: github.event_name == 'push' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      # versions.json pins the child binaries (and their hashes), so it is the key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/telinha/bin
          key: livekit-${{ runner.os }}-${{ hashFiles('versions.json') }}
      # The browsers, keyed on the Playwright that bun.lock resolved rather
      # than on bun.lock itself, which changes with every dependency bump. The
      # system libraries live outside the cache, so a hit still installs them.
      - id: pw-version
        run: echo "version=$(jq -r .version node_modules/playwright-core/package.json)" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - if: github.event_name == 'push' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}
      - run: bun run build
      - run: bun run e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Native binaries. Windows targets build on Windows: Bun writes the version
  # resource (ProductName etc.) only there.
  binaries:
    needs: changes
    if: needs.changes.outputs.binaries == 'true'
    name: binaries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-2025
            target: windows
            # The Windows zips carry the tray icon, built below.
            args: --tray tray/bin/Release/net48/telinha-tray.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # The run smoke: DEV_USER mode, no Discord, no ingress, no router.
    env:
      INGRESS: external
      MEDIA: self
      DEV_USER: "1:smoke"
      PUBLIC_URL: http://localhost:18081
      LISTEN: 127.0.0.1:18081
      LIVEKIT_PORT: "17880"
      MEDIA_TCP_PORT: "17881"
      MEDIA_UDP_PORT: "17882"
      # Skips STUN: the runner's public address is irrelevant here.
      LIVEKIT_NODE_IP: 127.0.0.1
      IP_WATCH_SECONDS: "0"
      AUTO_UPDATE: "off"
      UPNP: "off"
      # Fixture values (as in scripts/smoke.sh), not secrets.
      COOKIE_SECRET: smoke
      LIVEKIT_API_KEY: smoke
      LIVEKIT_API_SECRET: smoke-secret-of-at-least-32-chars # gitleaks:allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: bun
          cache_save: ${{ github.event_name == 'push' }}
      # The compile targets (bun-<target>-v<version>) land in the install cache
      # too: they change with Bun, the packages with bun.lock. As in the test
      # job, PRs restore both and only pushes to main save them. The packages
      # get their own bun-all prefix: this install takes every OS and CPU, about
      # four times the other jobs' entry, and neither should be served the other.
      - id: bun-targets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache/bun-*-v${{ steps.mise.outputs.bun }}
          key: bun-targets-${{ runner.os }}-${{ steps.mise.outputs.bun }}
      - id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            !~/.bun/install/cache/bun-*-v${{ steps.mise.outputs.bun }}
          key: bun-all-${{ runner.os }}-${{ steps.mise.outputs.bun }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-all-${{ runner.os }}-${{ steps.mise.outputs.bun }}-
      # The binary downloads livekit-server into <TELINHA_HOME>/bin itself;
      # versions.json pins it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/th/bin
          key: telinha-bin-${{ runner.os }}-${{ hashFiles('versions.json') }}
      # Every OS/CPU's native packages (OpenTUI's per-target library): the
      # cross builds embed the target's, not the runner's.
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - if: github.event_name == 'push' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            !~/.bun/install/cache/bun-*-v${{ steps.mise.outputs.bun }}
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      - run: bun run build
      - if: runner.os == 'Windows'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      # The test job's NuGet cache (it holds the tray's packages too); only
      # that job saves it.
      - if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('tray/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      # The test job runs the tray's tests; this is only the versioned build the
      # zips and the version resource check below need.
      - name: tray
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          dotnet build tray/telinha-tray.csproj -c Release -nologo -p:Version=$v
      # --smoke runs the host binary's --version and its terminal UI smoke, and
      # checks the binary sizes and that Babel was not bundled.
      - name: compile
        shell: bash
        run: bun scripts/build-binary.ts --target ${{ matrix.target }} --smoke ${{ matrix.args }}
      # The compile above is what downloads the targets, so they save after it.
      - if: github.event_name == 'push' && steps.bun-targets.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache/bun-*-v${{ steps.mise.outputs.bun }}
          key: ${{ steps.bun-targets.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: |
            dist-bin/telinha-*
            dist-bin/SHA256SUMS
          retention-days: 7

      - name: run (linux-x64)
        if: runner.os == 'Linux'
        env:
          TELINHA_HOME: ${{ runner.temp }}/th
        run: |
          base=http://127.0.0.1:18081
          log="$RUNNER_TEMP/telinha.log"
          dist-bin/linux-x64/telinha run >"$log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            echo '--- telinha log'
            cat "$log"
          }
          trap cleanup EXIT
          fail() { echo "FAIL: $*" >&2; exit 1; }
          # Up means HTTP answers and livekit-server (downloaded on a cold cache) runs.
          health=''
          for _ in $(seq 120); do
            kill -0 "$pid" 2>/dev/null || fail 'telinha exited'
            health=$(curl -fsS "$base/healthz" 2>/dev/null || true)
            case $health in *'"livekit":"up"'*) break ;; esac
            sleep 1
          done
          echo "healthz: $health"
          case $health in *'"livekit":"up"'*) ;; *) fail 'livekit not up within 120 s' ;; esac
          out=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$base/r/")
          case $out in '302 '*/auth/login*) ;; *) fail "/r/ is not a 302 to /auth/login: $out" ;; esac
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/doctor")
          [ "$code" = 404 ] || fail "/doctor without a token is not a 404: $code"
          kill -TERM "$pid"
          status=0
          wait "$pid" || status=$?
          [ "$status" = 0 ] || fail "exit $status after SIGTERM"
          echo ok
      # The real setup screens in a pseudo-terminal. OpenTUI writes a diff stream
      # (escapes everywhere, unchanged blanks skipped with cursor moves), so the
      # escapes and all whitespace go before looking for the first question's title.
      # '#' delimits so the CSI intermediates can be [ -/]: an escaped '\/' inside a
      # bracket stays a backslash range in GNU sed and eats the letter after ESC[1C.
      # scripts/build-binary.test.ts runs this filter on a sample; keep both copies identical.
      # Then Ctrl+C must quit cleanly: exit 130 ("Nothing was written."), the
      # alternate screen left (ESC[?1049l), not a stack trace with exit 1.
      - name: setup screens (linux-x64)
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: |
          status=0
          ( sleep 5; printf '\003' ) | script -qfec "stty cols 120 rows 34; dist-bin/linux-x64/telinha setup --home '$RUNNER_TEMP/tui' --lang en" /dev/null > tui.out || status=$?
          sed -E 's#\x1b\][^\x07\x1b]*(\x07|\x1b\\)##g; s#\x1b\[[0-?]*[ -/]*[@-~]##g; s#\x1b[()][A-Za-z0-9]##g' tui.out \
            | tr -d ' \t\r\n' > tui.txt
          grep -qF 'WherewillTelinharun?' tui.txt || { cat -v tui.out | tail -c 4000; exit 1; }
          [ "$status" = 130 ] || { echo "exit $status after Ctrl+C, want 130"; exit 1; }
          grep -qF "$(printf '\033[?1049l')" tui.out || { echo 'alternate screen not left'; exit 1; }
      # Without a terminal setup takes every answer from flags and exits 2 on
      # what is missing; OpenTUI would wait forever for a terminal's replies.
      # A hang ends as timeout's 124.
      - name: setup without a terminal (linux-x64)
        if: runner.os == 'Linux'
        timeout-minutes: 1
        run: |
          rc=0
          timeout 30 dist-bin/linux-x64/telinha setup --home "$RUNNER_TEMP/nt" --lang en </dev/null || rc=$?
          [ "$rc" = 2 ] || { echo "non-TTY setup exit $rc, want 2"; exit 1; }
      # No arm64 runner: QEMU runs the arm64 binary's --version and terminal UI smoke.
      # Its binfmt image is cached on main only, as in the image job. The debian
      # image is pinned to a digest, which a renovate.json regex manager refreshes.
      - if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          cache-image: ${{ github.event_name == 'push' }}
      - name: --version (linux-arm64)
        if: runner.os == 'Linux'
        run: docker run --rm --platform linux/arm64 -e TELINHA_SMOKE_TUI=1 -v "$PWD/dist-bin:/b:ro" debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587 /b/linux-arm64/telinha --version

      - name: run (windows-x64)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TELINHA_HOME: ${{ runner.temp }}/th
        run: |
          $base = 'http://127.0.0.1:18081'
          $log = Join-Path $env:RUNNER_TEMP 'telinha.log'
          $p = Start-Process dist-bin/windows-x64/telinha.exe -ArgumentList run -NoNewWindow -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          # Holding the handle keeps ExitCode readable once the process ends.
          $null = $p.Handle
          function Fail($why) {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
            Write-Error "FAIL: $why" -ErrorAction Continue
            exit 1
          }
          # Up means HTTP answers and livekit-server (downloaded on a cold cache) runs.
          $health = ''
          foreach ($i in 1..120) {
            if ($p.HasExited) { Fail "telinha exited ($($p.ExitCode))" }
            $health = "$(curl.exe -fsS "$base/healthz" 2>$null)"
            if ($health -like '*"livekit":"up"*') { break }
            Start-Sleep -Seconds 1
          }
          "healthz: $health"
          if ($health -notlike '*"livekit":"up"*') { Fail 'livekit not up within 120 s' }
          $out = curl.exe -sS -o NUL -w '%{http_code} %{redirect_url}' "$base/r/"
          if ($out -notlike '302 */auth/login*') { Fail "/r/ is not a 302 to /auth/login: $out" }
          $code = curl.exe -sS -o NUL -w '%{http_code}' "$base/doctor"
          if ($code -ne '404') { Fail "/doctor without a token is not a 404: $code" }
          # No SIGTERM on Windows: the local control endpoint is the graceful stop.
          $token = (Get-Content (Join-Path $env:TELINHA_HOME 'data/run/control.token') -Raw).Trim()
          $body = Join-Path $env:RUNNER_TEMP 'shutdown.json'
          Set-Content $body '{"reason":"stop"}' -NoNewline
          $code = curl.exe -sS -o NUL -w '%{http_code}' -X POST -H "Authorization: Bearer $token" `
            -H 'Content-Type: application/json' --data-binary "@$body" "$base/internal/shutdown"
          if ($code -ne '202') { Fail "/internal/shutdown answered $code" }
          if (-not $p.WaitForExit(30000)) { Fail 'still running 30 s after /internal/shutdown' }
          if ($p.ExitCode -ne 0) { Fail "exit $($p.ExitCode) after /internal/shutdown" }
          Get-Content $log
          'ok'
      - name: zip contents
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($t in 'windows-x64', 'windows-arm64') {
            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist-bin/telinha-$t.zip").Path)
            try { $names = @($zip.Entries.FullName) -join ', ' } finally { $zip.Dispose() }
            "telinha-${t}.zip: $names"
            if ($names -ne 'telinha.exe, telinha-tray.exe, LICENSE') { Write-Error "telinha-$t.zip holds $names" -ErrorAction Continue; exit 1 }
          }
      # The version resource is why the Windows targets build here. Both exes
      # carry the same ProductName and release version (code signing wants that).
      - name: version resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Fail($why) { Write-Error "FAIL: $why" -ErrorAction Continue; exit 1 }
          foreach ($t in 'windows-x64', 'windows-arm64') {
            $info = (Get-Item "dist-bin/$t/telinha.exe").VersionInfo
            "${t}: $($info.ProductName) $($info.FileVersion) ($($info.CompanyName))"
            if ($info.ProductName -ne 'Telinha') { Fail "$t has no version resource" }
          }
          $v = (Get-Content package.json | ConvertFrom-Json).version
          # cmd needs backslashes, and waits for the GUI exe and captures what it prints.
          $tray = (Resolve-Path tray/bin/Release/net48/telinha-tray.exe).Path
          $info = (Get-Item $tray).VersionInfo
          "telinha-tray: $($info.ProductName) $($info.ProductVersion) $($info.FileVersion) ($($info.CompanyName))"
          if ($info.ProductName -ne 'Telinha') { Fail "telinha-tray ProductName is '$($info.ProductName)'" }
          if ($info.ProductVersion -ne $v) { Fail "telinha-tray ProductVersion is '$($info.ProductVersion)', want '$v'" }
          # Four numbers, prerelease dropped: 0.7.0-rc.1 -> 0.7.0.0.
          $file = "$($v.Split('-')[0]).0"
          if ($info.FileVersion -ne $file) { Fail "telinha-tray FileVersion is '$($info.FileVersion)', want '$file'" }
          $line = "$(cmd /c "`"$tray`" --version")".Trim()
          $line
          if ($line -ne "telinha-tray $v") { Fail "telinha-tray --version printed '$line', want 'telinha-tray $v'" }
      # Start, status and stop through the CLI, against the run step's home.
      - name: tray smoke
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TELINHA_HOME: ${{ runner.temp }}/th
        run: |
          $tray = Join-Path $env:TELINHA_HOME 'bin/telinha-tray.exe'
          $state = Join-Path $env:TELINHA_HOME 'data/run/tray.json'
          $trayLog = Join-Path $env:TELINHA_HOME 'logs/telinha-tray.log'
          $cli = 'dist-bin/windows-x64/telinha.exe'
          # `tray status` only reports a tray installed in <home>\bin.
          $null = New-Item -ItemType Directory -Force (Split-Path $tray)
          Copy-Item tray/bin/Release/net48/telinha-tray.exe $tray -Force
          # The runner is elevated and the tray refuses to run that way: start it
          # with a normal-user token (Administrators deny-only), as runas /trustlevel does.
          Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class NormalUser {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
            struct StartupInfo {
              public int cb; public string reserved, desktop, title;
              public int x, y, xSize, ySize, xChars, yChars, fill, flags;
              public short show, reserved2; public IntPtr reserved3, stdin, stdout, stderr;
            }
            [StructLayout(LayoutKind.Sequential)]
            struct ProcessInfo { public IntPtr process, thread; public int pid, tid; }
            [DllImport("advapi32.dll", SetLastError = true)]
            static extern bool SaferCreateLevel(int scope, int level, int flags, out IntPtr handle, IntPtr reserved);
            [DllImport("advapi32.dll", SetLastError = true)]
            static extern bool SaferComputeTokenFromLevel(IntPtr level, IntPtr token, out IntPtr result, int flags, IntPtr reserved);
            [DllImport("advapi32.dll")]
            static extern bool SaferCloseLevel(IntPtr level);
            [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
            static extern bool CreateProcessAsUser(IntPtr token, string app, StringBuilder cmd, IntPtr pa, IntPtr ta, bool inherit,
              int flags, IntPtr env, string cwd, ref StartupInfo si, out ProcessInfo pi);
            [DllImport("kernel32.dll")]
            static extern bool CloseHandle(IntPtr handle);
            public static int Start(string exe) {
              IntPtr level, token;
              // SAFER_SCOPEID_USER, SAFER_LEVELID_NORMALUSER, SAFER_LEVEL_OPEN
              if (!SaferCreateLevel(2, 0x20000, 1, out level, IntPtr.Zero)) throw new Win32Exception();
              try { if (!SaferComputeTokenFromLevel(level, IntPtr.Zero, out token, 0, IntPtr.Zero)) throw new Win32Exception(); }
              finally { SaferCloseLevel(level); }
              try {
                var si = new StartupInfo();
                si.cb = Marshal.SizeOf(si);
                ProcessInfo pi;
                // A null environment: the tray inherits this one (TELINHA_HOME).
                if (!CreateProcessAsUser(token, exe, new StringBuilder("\"" + exe + "\""), IntPtr.Zero, IntPtr.Zero, false, 0, IntPtr.Zero, null, ref si, out pi))
                  throw new Win32Exception();
                CloseHandle(pi.thread);
                CloseHandle(pi.process);
                return pi.pid;
              } finally { CloseHandle(token); }
            }
          }
          '@
          function Fail($why) {
            Get-Content $trayLog -ErrorAction SilentlyContinue
            Write-Error "FAIL: $why" -ErrorAction Continue
            exit 1
          }
          $trayPid = 0
          try {
            $trayPid = [NormalUser]::Start((Resolve-Path $tray).Path)
            $st = $null
            foreach ($i in 1..50) {
              if (Test-Path $state) { $st = Get-Content $state -Raw | ConvertFrom-Json }
              if ($st.pid -eq $trayPid) { break }
              if (-not (Get-Process -Id $trayPid -ErrorAction SilentlyContinue)) { Fail 'telinha-tray exited' }
              Start-Sleep -Milliseconds 200
            }
            if ($st.pid -ne $trayPid) { Fail "no tray.json with pid $trayPid within 10 s" }
            "tray.json: $($st | ConvertTo-Json -Compress)"
            $out = & $cli tray status
            "$out"
            if ($LASTEXITCODE -ne 0) { Fail "tray status exited $LASTEXITCODE" }
            if ("$out" -notlike "*$trayPid*") { Fail "tray status does not name pid $trayPid" }
            & $cli tray stop
            if ($LASTEXITCODE -ne 0) { Fail "tray stop exited $LASTEXITCODE" }
            if (Get-Process -Id $trayPid -ErrorAction SilentlyContinue) { Fail 'telinha-tray still running after tray stop' }
            if (Test-Path $state) { Fail 'tray.json left behind' }
            'ok'
          } finally {
            if ($trayPid) { Stop-Process -Id $trayPid -Force -ErrorAction SilentlyContinue }
            # bin/ is cached for livekit-server; keep the tray out of it.
            Remove-Item $tray -Force -ErrorAction SilentlyContinue
          }
      # A Bun --compile exe keeps its bundle in PE sections, so signing must
      # leave it runnable: sign copies with a throwaway certificate and run them.
      - name: authenticode
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          function Fail($why) { Write-Error "FAIL: $why" -ErrorAction Continue; exit 1 }
          $dir = Join-Path $env:RUNNER_TEMP 'signed'
          $null = New-Item -ItemType Directory -Force $dir
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Telinha CI signing check' `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          try {
            $checks = @(
              @{ src = 'dist-bin/windows-x64/telinha.exe'; want = "telinha $v" },
              @{ src = 'tray/bin/Release/net48/telinha-tray.exe'; want = "telinha-tray $v" }
            )
            foreach ($c in $checks) {
              $copy = Join-Path $dir (Split-Path $c.src -Leaf)
              Copy-Item $c.src $copy -Force
              $null = Set-AuthenticodeSignature -FilePath $copy -Certificate $cert -HashAlgorithm SHA256
              $sig = Get-AuthenticodeSignature $copy
              $size = (Get-Item $c.src).Length
              $signed = (Get-Item $copy).Length
              "$(Split-Path $copy -Leaf): $($sig.Status), $size -> $signed bytes"
              if ($sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { Fail "$copy is not signed by the test certificate" }
              # The self-signed root is untrusted: UnknownError, with the right signer.
              if ($sig.Status -notin 'Valid', 'UnknownError') { Fail "$copy signature status $($sig.Status)" }
              if ($signed -le $size) { Fail "$copy did not grow when signed" }
              $line = "$(cmd /c "`"$copy`" --version")".Trim()
              $line
              if ($line -ne $c.want -and -not $line.StartsWith("$($c.want) ")) { Fail "signed $copy --version printed '$line', want '$($c.want)'" }
            }
          } finally {
            # The store API, never Remove-Item on the Cert: drive.
            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('My', 'CurrentUser')
            $store.Open('ReadWrite')
            $store.Remove($cert)
            $store.Close()
          }

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise only, no tools yet: a --locked install of a tool mise.lock lacks
      # would fail before the freshness check below can say why.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install: false
          install_args: bun github:jdx/jactionlint shellcheck hadolint editorconfig-checker biome
          cache_save: ${{ github.event_name == 'push' }}
      # mise lock keeps every locked version and rewrites only what mise.toml
      # no longer matches, so a diff means mise.lock was not refreshed with it.
      # The token lifts the anonymous GitHub API limit for the release lookups.
      - name: mise.lock
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise lock
          git diff --exit-code -- mise.lock || { echo '::error file=mise.lock::mise.lock is stale: run mise lock and commit the result'; exit 1; }
      # The linters at the versions mise.toml pins (mise.lock has their URLs and
      # checksums), the same binaries `mise install` gives a dev machine. bun
      # runs the versions.json check below.
      - name: install tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install --locked bun github:jdx/jactionlint shellcheck hadolint editorconfig-checker biome
      # Listed explicitly: telinha-update has no extension, and a missing file
      # should fail the job rather than be silently skipped.
      - name: shellcheck
        run: >-
          shellcheck
          deploy/install-docker.sh
          deploy/install.sh
          deploy/telinha-update
          scripts/smoke.sh
      # The runner's pwsh parses it; Write-Host is how the bootstrap talks to
      # the person running it. PSScriptAnalyzer is pinned here (Renovate bumps
      # it) and loaded at that exact version over whatever the image ships; a
      # failed install fails the job.
      - name: install.ps1
        shell: pwsh
        run: |
          $path = (Resolve-Path deploy/install.ps1).Path
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errs)
          if ($errs) { $errs; exit 1 }
          $psa = Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -PassThru -ErrorAction Stop
          $loaded = Import-Module PSScriptAnalyzer -RequiredVersion $psa.Version -PassThru -ErrorAction Stop
          Write-Host "PSScriptAnalyzer $($loaded.Version)"
          $issues = Invoke-ScriptAnalyzer -Path $path -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost
          if ($issues) { $issues | Format-Table -AutoSize | Out-String -Width 200; exit 1 }
      # jactionlint finds the shellcheck above on PATH and runs it on every
      # run: block too. .github/jactionlint.yaml lists what it ignores.
      - name: actionlint
        run: jactionlint -color
      # The Dockerfile, its RUN lines included (hadolint has shellcheck built
      # in). .hadolint.yaml lists the rules it ignores and why.
      - name: hadolint
        run: hadolint Dockerfile
      # Every tracked text file against .editorconfig; .editorconfig says which
      # check is off and why.
      - name: editorconfig
        run: editorconfig-checker
      # Formatting, lint rules and import order (biome.jsonc); errors fail the
      # job, warnings show up as annotations on the PR.
      - name: biome
        run: biome ci --reporter=default --reporter=github .
      # Structure and every asset hash present; a stale hash fails the image job.
      - name: versions.json
        run: bun scripts/versions.ts check

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: bun
          cache_save: ${{ github.event_name == 'push' }}
      # Bun's package cache, restored here and saved by pushes to main only (see
      # the test job).
      - id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ steps.mise.outputs.bun }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ steps.mise.outputs.bun }}-
      - run: bun install --frozen-lockfile
      - if: github.event_name == 'push' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      # The link validator runs inside the build and fails it on a broken link.
      - run: bun run docs:build

  # The commits a PR adds, or a push to main adds, scanned with the gitleaks
  # mise.toml pins. Same range and git log options gitleaks-action used, which
  # is what this replaces: the action pinned its own older gitleaks.
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # bun too: mise install runs mise.toml's postinstall hook, which is a bun
      # script (a no-op in CI).
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: bun gitleaks
          cache_save: ${{ github.event_name == 'push' }}
      # A push whose previous tip is unknown here (zeros, or rewritten away)
      # scans the whole history rather than guess a range. Findings print
      # redacted; `gitleaks:allow` on a line still exempts it.
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
          fi
          echo "scanning $range"
          gitleaks git --redact -v --no-banner --log-opts="--no-merges --first-parent $range"

  # The image build also compiles our Caddy (xcaddy + DuckDNS + layer4), and the
  # smoke test checks its version and modules and validates the DNS-01 and TURN
  # (layer4, PROXY v2) Caddyfiles.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # arm64's final stage (apk, setcap) runs emulated; the heavy stages run natively.
      # The action caches the binfmt image it pulls; only pushes to main use
      # that cache, and a PR pulls the small image instead of adding an entry.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          cache-image: ${{ github.event_name == 'push' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Both release platforms build, so an arm64 break shows up before release.
      # Layers come from the Actions cache that pushes to main write (mode=max:
      # every stage, so a change rebuilds only from the layer it touches). PRs
      # read it and never write, which keeps them out of the 10 GB budget, and
      # a failed export only warns.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Local checkout, not the default git context, so the PR's tree is built.
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=telinha-image
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=telinha-image,ignore-error=true' || '' }}
      # amd64 again, loaded into the daemon for the smoke test. The builder
      # still holds the layers from the call above, so it needs no cache-from.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: telinha:ci
      # Same script as `bun run image`; it ships in the image, whose
      # entrypoint is the program itself.
      - name: smoke
        run: docker run --rm --entrypoint sh telinha:ci scripts/smoke.sh
      # `setup --docker` in a pseudo-terminal: the target's musl native library
      # is installed and OPENTUI_LIBC=musl selects it. Same filter and the same
      # clean Ctrl+C checks as the binaries job.
      - name: setup screens
        timeout-minutes: 2
        run: |
          status=0
          ( sleep 5; printf '\003' ) | script -qfec "stty cols 120 rows 34; docker run --rm -it -e TELINHA_HOME=/telinha telinha:ci setup --docker --lang en" /dev/null > tui.out || status=$?
          sed -E 's#\x1b\][^\x07\x1b]*(\x07|\x1b\\)##g; s#\x1b\[[0-?]*[ -/]*[@-~]##g; s#\x1b[()][A-Za-z0-9]##g' tui.out \
            | tr -d ' \t\r\n' > tui.txt
          grep -qF 'WherewillTelinharun?' tui.txt || { cat -v tui.out | tail -c 4000; exit 1; }
          [ "$status" = 130 ] || { echo "exit $status after Ctrl+C, want 130"; exit 1; }
          grep -qF "$(printf '\033[?1049l')" tui.out || { echo 'alternate screen not left'; exit 1; }
      # Without a terminal (no -it): exit 2 at once, as in the binaries job.
      - name: setup without a terminal
        timeout-minutes: 2
        run: |
          rc=0
          timeout 60 docker run --rm telinha:ci setup --docker --lang en </dev/null || rc=$?
          [ "$rc" = 2 ] || { echo "non-TTY setup exit $rc, want 2"; exit 1; }

  # Windows Caddy through the same Dockerfile stage the release uses, so a
  # Windows-only Go build break in a module bump shows up before release (the
  # image job covers linux).
  caddy:
    needs: changes
    if: needs.changes.outputs.caddy == 'true'
    name: caddy (windows-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Its own cache scope, written by pushes to main only as in the image job,
      # so the Go build stays cached until versions.json or the Dockerfile changes.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: caddy-export
          cache-from: type=gha,scope=caddy-windows
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=caddy-windows,ignore-error=true' || '' }}
          build-args: |
            CADDY_OS=windows
            CADDY_ARCH=amd64
          outputs: type=local,dest=dist-caddy
          push: false
      - name: caddy.exe
        run: test -s dist-caddy/caddy.exe

  # The one check the ruleset requires: it passes when every job in `needs`
  # passed (or was skipped), so adding, renaming or dropping a gating job is a
  # change to this list, not to the ruleset. Every job above gates, so
  # Renovate's automerge waits on all of them. `changes` is in it because its
  # failure would skip the jobs it gates.
  required:
    if: always()
    needs: [changes, test, e2e, binaries, lint, docs, gitleaks, image, caddy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every gating job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
