# release-please keeps a Release PR open on main; merging it creates a draft
# GitHub release for vX.Y.Z (no tag yet). The jobs below build the native
# binaries (the Windows exes Authenticode-signed when SignPath is configured),
# our Caddy build per os/arch (native installs fetch it and verify it
# through SHA256SUMS) and the image from that commit, upload every asset, then
# publish the release, which creates the tag. So releases/latest never points at a
# release without its assets, and a failed run leaves only a draft to finish
# or delete. Hosts running telinha-update wait for the tag, the image and its
# published digest (telinha-image.digest) before deploying. A stable release
# also redeploys the docs site (docs.yml) once it is published.
name: release

on:
  push:
    branches: [main]
  # Recovery: re-run release-please on main by hand (e.g. secrets added late).
  workflow_dispatch:

permissions: {}

# Never run two releases at once; queued runs wait instead of being cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    # All writes use the app token below; GITHUB_TOKEN needs nothing.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # The draft has no tag until it is published: later jobs check out this.
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # An app token (not GITHUB_TOKEN) so the Release PR triggers ci.yml.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # release-please labels its PRs through the issues API.
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Config "prerelease: true" would flag every 0.x release (release-please
      # marks major === 0 as pre-release), so rc tags are marked here instead.
      - if: steps.release.outputs.release_created == 'true' && contains(steps.release.outputs.tag_name, '-')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" --prerelease --repo "$GITHUB_REPOSITORY"

  # Windows targets build in binaries-windows: they are signed before packing.
  binaries:
    name: binaries (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # No caches, mise-action's included: release builds start from a clean runner.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: bun
          cache: false
      # Every OS/CPU's native packages: the cross builds embed the target's OpenTUI library.
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - run: bun run build
      # --smoke runs the host binary's --version against the release version,
      # its terminal UI smoke and the size and no-Babel checks.
      - name: compile
        shell: bash
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: bun scripts/build-binary.ts --target "${{ matrix.target }}" --version "${TAG#v}" --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: |
            dist-bin/telinha-*.tar.gz
            dist-bin/telinha-*.zip
          if-no-files-found: error
          retention-days: 7

  # Windows targets build on Windows: Bun writes the version resource only
  # there. The bare exes go to sign-windows, which signs and zips them.
  binaries-windows:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    # No caches, mise-action's included: release builds start from a clean runner.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: bun
          cache: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      # Every OS/CPU's native packages: the arm64 cross build embeds that target's OpenTUI library.
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - run: bun run build
      # Tests first: dotnet test rebuilds the tray without -p:Version. Both
      # restores are locked to the tray's packages.lock.json files (CI is set,
      # see tray/Directory.Build.props).
      - name: tray
        shell: bash
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          dotnet test tray/tests/telinha-tray.tests.csproj -c Release -nologo
          dotnet build tray/telinha-tray.csproj -c Release -nologo -p:Version="${TAG#v}"
      # --smoke runs the host binary's --version against the release version.
      - name: compile
        shell: bash
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          bun scripts/build-binary.ts --target windows --version "${TAG#v}" --smoke --no-pack
          mkdir -p dist-bin/tray
          cp tray/bin/Release/net48/telinha-tray.exe dist-bin/tray/
      # The artifact drops the common dist-bin/ prefix: these are the paths
      # .signpath/artifact-configuration.xml names.
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: |
            dist-bin/windows-x64/telinha.exe
            dist-bin/windows-arm64/telinha.exe
            dist-bin/tray/telinha-tray.exe
          if-no-files-found: error
          retention-days: 7

  # Signs the Windows exes through SignPath, then zips them, so SHA256SUMS and
  # the attestation cover the signed files. Missing SignPath configuration
  # skips signing (the release ships unsigned) and names what is missing; a
  # denied, failed or timed-out signing request fails the release.
  # The SignPath token and variables live in the `release` environment, whose
  # deployment branches allow main only: a run from any other branch (a
  # workflow_dispatch, or a copy of this file) cannot read them.
  sign-windows:
    needs: [release-please, binaries-windows]
    if: github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created == 'true'
    environment: release
    runs-on: windows-2025
    permissions:
      contents: read
      # The SignPath action downloads the artifact through the API with this token.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: bun
          cache: false
      # build-binary.ts imports the Solid plugin: install it from the lockfile
      # rather than letting Bun auto-install whatever npm has today.
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-unsigned
          path: unsigned
      # A job-level if: cannot read secrets, so this step decides. Names only:
      # the token itself is never printed.
      - id: gate
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_POLICY_SLUG }}
        run: |
          missing=()
          [ -n "$SIGNPATH_API_TOKEN" ] || missing+=("secret SIGNPATH_API_TOKEN")
          [ -n "$ORG" ] || missing+=("variable SIGNPATH_ORGANIZATION_ID")
          [ -n "$PROJECT" ] || missing+=("variable SIGNPATH_PROJECT_SLUG")
          [ -n "$POLICY" ] || missing+=("variable SIGNPATH_POLICY_SLUG")
          if [ ${#missing[@]} -eq 0 ]; then
            echo enabled=true >>"$GITHUB_OUTPUT"
          else
            list=$(printf '%s, ' "${missing[@]}")
            echo "::notice title=Code signing skipped::the Windows exes ship unsigned; the release environment lacks ${list%, }"
            echo enabled=false >>"$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        # Pinned to a commit: this step holds the signing token and returns the
        # files that ship. Renovate proposes bumps, reviewed by hand.
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ needs.binaries-windows.outputs.artifact-id }}
          wait-for-completion: true
          # Every release is approved by hand on SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: verify signatures
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        run: |
          foreach ($f in 'windows-x64/telinha.exe', 'windows-arm64/telinha.exe', 'tray/telinha-tray.exe') {
            $sig = Get-AuthenticodeSignature (Join-Path signed $f)
            "${f}: $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne 'Valid') { Write-Error "$f is not validly signed: $($sig.StatusMessage)" -ErrorAction Continue; exit 1 }
          }
      - name: pack
        shell: bash
        env:
          SIGNED: ${{ steps.gate.outputs.enabled }}
        run: |
          src=unsigned
          if [ "$SIGNED" = true ]; then src=signed; fi
          bun scripts/build-binary.ts pack --target windows --from "$src" --out dist-bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-windows
          path: dist-bin/telinha-windows-*.zip
          if-no-files-found: error
          retention-days: 7

  # Our Caddy build (upstream + caddy-dns/duckdns + caddy-l4), one asset per
  # os/arch, built by the Dockerfile's caddy-export stage so the Go toolchain
  # version lives in one place. Go cross-compiles: no emulation, no Windows runner.
  caddy:
    name: caddy (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - { target: linux-x64, os: linux, arch: amd64 }
          - { target: linux-arm64, os: linux, arch: arm64 }
          - { target: windows-x64, os: windows, arch: amd64 }
          - { target: windows-arm64, os: windows, arch: arm64 }
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The checked-out release commit, not the default git context (which is main).
          context: .
          target: caddy-export
          build-args: |
            CADDY_OS=${{ matrix.os }}
            CADDY_ARCH=${{ matrix.arch }}
          outputs: type=local,dest=dist-caddy
          push: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: bun
          cache: false
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-binary.ts pack-caddy --target "${{ matrix.target }}" --from dist-caddy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caddy-${{ matrix.target }}
          path: |
            dist-bin/caddy-*.tar.gz
            dist-bin/caddy-*.zip
          if-no-files-found: error
          retention-days: 7

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/sombrasoft/telinha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # The run is a push to main, so the tag comes from release-please.
          # latest is added automatically for stable semver, not pre-releases.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # arm64's final stage (apk, setcap) runs emulated; the heavy stages run natively.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The checked-out release commit, not the default git context (which is main).
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Provenance comes from actions/attest; skip buildx's own so the index
          # lists only the two platform images.
          provenance: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records only exist for organization-owned repos.
          create-storage-record: false
      # The index digest is the updater's trusted reference: it pulls by digest
      # and refuses a tag that resolves elsewhere. The asset name is the contract.
      # release-assets uploads them with everything else.
      - name: release assets
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "$DIGEST" > telinha-image.digest
          # The digest inside the bundle too: install-docker.sh runs the setup
          # wizard from exactly this image, never a moving tag.
          cp telinha-image.digest deploy/telinha-image.digest
          tar czf telinha-deploy.tar.gz -C deploy compose.yml compose.journald.yml \
            telinha.env.example install-docker.sh telinha-update \
            telinha-update.service telinha-update.timer telinha-image.digest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-assets
          path: |
            telinha-image.digest
            telinha-deploy.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Uploads every asset to the draft, then publishes it.
  release-assets:
    needs: [release-please, binaries, sign-windows, caddy, image]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: bun
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist-bin
      # Into dist-bin too: SHA256SUMS covers the caddy archives (a native
      # install fetches its release's Caddy and checks it against the sums),
      # the Docker bundle and the image digest (install.sh verifies the bundle
      # before running it as root).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: caddy-*
          merge-multiple: true
          path: dist-bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-assets
          path: dist-bin
      - name: SHA256SUMS
        run: bun scripts/build-binary.ts sums
      # One provenance attestation for every archive (the deploy bundle
      # included), the image digest and the sums file.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-bin/telinha-*.tar.gz
            dist-bin/telinha-*.zip
            dist-bin/caddy-*.tar.gz
            dist-bin/caddy-*.zip
            dist-bin/telinha-image.digest
            dist-bin/SHA256SUMS
      # Its own token: release-please's is a masked job output (arrives empty),
      # and GITHUB_TOKEN here is contents: read on purpose.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: upload release assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: >-
          gh release upload "$TAG"
          dist-bin/telinha-*.tar.gz dist-bin/telinha-*.zip dist-bin/SHA256SUMS
          dist-bin/caddy-*.tar.gz dist-bin/caddy-*.zip
          dist-bin/telinha-image.digest
          deploy/install.sh deploy/install.ps1
          --clobber --repo "$GITHUB_REPOSITORY"
      # Creates the tag at the release commit and, for a stable version, makes
      # it latest: from here on releases/latest/download/* serves these assets.
      - name: publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  # The docs site follows each stable release. Called (not triggered by the
  # release event) so the deploy runs on main, which the Pages environment
  # allows; the checkout is still the release commit.
  docs:
    needs: [release-please, release-assets]
    if: needs.release-please.outputs.release_created == 'true' && !contains(needs.release-please.outputs.tag_name, '-')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
