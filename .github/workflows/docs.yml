# Builds the docs site and deploys it to GitHub Pages. release.yml calls it
# after publishing a stable release (so the run is on main, which the Pages
# environment allows, and the checkout is the release commit); it can also
# be run by hand from main. Pages must use the "GitHub Actions" source.
name: docs

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build, empty for the run's own ref
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on workflow_dispatch: checkout then uses the run's own ref.
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # No cache: this deploys the site, and release.yml calls it, so it starts
      # from a clean runner like the release builds.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: bun
          cache: false
      - run: bun install --frozen-lockfile
      # The link validator runs inside the build and fails it on a broken link.
      - run: bun run docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deploy at a time; a queued run waits rather than cancelling.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
